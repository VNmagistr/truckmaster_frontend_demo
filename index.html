<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <link rel="mask-icon" href="/favicon.svg" color="#f5c518" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5c518" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Італ Трак" />
    <!-- Fallback SEO (до завантаження React) -->
    <meta name="description" content="Сервіс Iveco — ремонт, ТО та діагностика вантажівок Daily, S-Way, X-Way, Stralis. Дзвоніть: +380 95 595 0777" />
    <title>Сервісний центр Iveco в Україні | Італ Трак</title>
    <!-- Preconnect для прискорення завантаження -->
    <link rel="preconnect" href="https://api.ital-truck.com.ua" />
    <link rel="dns-prefetch" href="https://maps.googleapis.com" />

    <!-- Google Analytics 4 (ID береться з VITE_GA_MEASUREMENT_ID; page_view шлемо вручну при зміні роуту) -->
    <script>
      (function () {
        var gaId = '%VITE_GA_MEASUREMENT_ID%';
        if (!gaId || gaId.charAt(0) === '%') return;
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=' + gaId;
        document.head.appendChild(s);
        window.dataLayer = window.dataLayer || [];
        window.gtag = function () { window.dataLayer.push(arguments); };
        window.gtag('js', new Date());
        window.gtag('config', gaId, { send_page_view: false });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
