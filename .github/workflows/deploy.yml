name: Deploy Frontend to DigitalOcean

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        env:
          VITE_API_URL: http://REMOVED/api
          VITE_APP_TITLE: TruckMaster CRM

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DO_SSH_KEY }}
          SSH_HOST: ${{ secrets.DO_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H $SSH_HOST >> ~/.ssh/known_hosts 2>/dev/null
          
          # Debug: check key format
          echo "Key file permissions:"
          ls -la ~/.ssh/id_ed25519
          echo "Key starts with:"
          head -1 ~/.ssh/id_ed25519

      - name: Deploy to Server
        env:
          SSH_USER: ${{ secrets.DO_USERNAME }}
          SSH_HOST: ${{ secrets.DO_HOST }}
        run: |
          # Test connection
          ssh -o BatchMode=yes -o ConnectTimeout=10 ${SSH_USER}@${SSH_HOST} "echo 'SSH connection OK'"
          
          # Clean old files
          ssh ${SSH_USER}@${SSH_HOST} "rm -rf /var/www/truckmaster-frontend/*"
          
          # Upload new build
          scp -r dist/* ${SSH_USER}@${SSH_HOST}:/var/www/truckmaster-frontend/
          
          # Reload nginx
          ssh ${SSH_USER}@${SSH_HOST} "sudo systemctl reload nginx"
          
          echo "✅ Frontend deployment completed!"

      - name: Verify Deployment
        run: |
          sleep 5
          curl -f http://${{ secrets.DO_HOST }}/ || echo "⚠️ Warning: Frontend not responding"