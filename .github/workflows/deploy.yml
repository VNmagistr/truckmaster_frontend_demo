name: Deploy Frontend to DigitalOcean

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        env:
          VITE_API_URL: http://REMOVED/api
          VITE_APP_TITLE: TruckMaster CRM

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DO_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.DO_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to Server
        run: |
          ssh ${{ secrets.DO_USERNAME }}@${{ secrets.DO_HOST }} << 'EOF'
            set -e
            echo "🧹 Cleaning old files..."
            rm -rf /var/www/truckmaster-frontend/*
          EOF

          echo "📦 Uploading new build..."
          scp -r dist/* ${{ secrets.DO_USERNAME }}@${{ secrets.DO_HOST }}:/var/www/truckmaster-frontend/

          ssh ${{ secrets.DO_USERNAME }}@${{ secrets.DO_HOST }} << 'EOF'
            set -e
            echo "🔄 Reloading nginx..."
            sudo systemctl reload nginx
            echo "✅ Frontend deployment completed!"
          EOF

      - name: Verify Deployment
        run: |
          sleep 5
          echo "🔍 Verifying deployment..."
          curl -f http://${{ secrets.DO_HOST }}/ || echo "⚠️ Warning: Frontend not responding"